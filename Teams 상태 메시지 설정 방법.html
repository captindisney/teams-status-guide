<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teams 상태 메시지 설정 방법</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f4fa;--card:#fff;--ink:#1d1630;--sub:#6a6279;--line:#ddd6ea;--brand:#4d148c;--brand-ink:#fff;--accent:#ff6200;--ok:#14803c;--ok-bg:#e4f5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15101f;--card:#1f182d;--ink:#f1ecfa;--sub:#a79dbb;--line:#3a2f52;--brand:#b794f4;--brand-ink:#1d1630;--ok:#6fdc97;--ok-bg:#183626;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15101f;--card:#1f182d;--ink:#f1ecfa;--sub:#a79dbb;--line:#3a2f52;--brand:#b794f4;--brand-ink:#1d1630;--ok:#6fdc97;--ok-bg:#183626;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{padding:28px 4px 20px}
header p{margin:0 0 6px;color:var(--sub);font-size:14px}
h1{margin:0;font-size:26px;line-height:1.3;font-weight:700;letter-spacing:-.02em}
.meta{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--sub)}
ol{list-style:none;margin:0;padding:0;position:relative}
li{position:relative;padding:0 0 22px 52px}
li::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
li:last-child::before{display:none}
.n{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
li.done .n{background:var(--ok);color:#fff}
.t{margin:0 0 4px;padding-top:6px;font-size:17px;font-weight:500;line-height:1.5}
.t b{font-weight:700;color:var(--brand)}
.hint{margin:0 0 10px;font-size:14px;color:var(--sub)}
figure{margin:10px 0 0}
.shot{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);cursor:zoom-in}
.shot img{display:block;width:100%;height:auto}
figcaption{margin-top:6px;font-size:12px;color:var(--sub)}
.finish{margin-top:6px;padding:14px 16px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:16px}
footer{margin-top:8px;padding:14px 4px 0;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(10,6,20,.92);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom.on{display:block}
.zoom img{width:220vw;max-width:none;height:auto;display:block}
.zoom button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:21;border:0;border-radius:999px;padding:8px 16px;font:500 14px "Noto Sans KR",sans-serif;background:#fff;color:#1d1630}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

<main>
<header>
<p>Teams 사용 가이드</p>
